version: '3.0'

services:
  # MySQL 服务
  mysql8:
    image: mysql:8.0.29
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root  # 建议生产环境使用更复杂的密码
    ports:
      - "3306:3306"
    networks:
      - app-network

  # Redis 服务
  redis:
    image: 'bitnami/redis:latest'
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes  # 仅用于测试，生产环境请设置密码
    ports:
      - '6379:6379'
    networks:
      - app-network

  # RabbitMQ 服务（带管理界面）
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123  # 请根据安全要求修改
    ports:
      - "5672:5672"    # AMQP 协议端口（应用连接用）
      - "15672:15672"  # Web 管理界面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

# 共享网络（所有服务通过服务名互相访问）
networks:
  app-network:
    driver: bridge

# 数据卷（持久化 RabbitMQ 数据）
volumes:
  rabbitmq_data:
    driver: local